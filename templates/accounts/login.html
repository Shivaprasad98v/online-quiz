{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Login</h2>
    <p class="text-muted">Access your examination dashboard.</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button class="btn btn-primary w-100" type="submit">
            Login
        </button>
    </form>

    <p class="mt-3">
        New student?
        <a href="{% url 'register' %}">Create an account</a>
    </p>
</div>
{% endblock %}
